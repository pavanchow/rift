[package]
name = "rift"
version = "0.1.0"
edition = "2021"
description = "A programmable single-binary reverse proxy where routing rules are a compiled DSL, not YAML."

[dependencies]
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
regex = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
